name: Merge odds

on:
  workflow_dispatch:
  schedule:
    - cron: "35 * * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Marry the two feeds
        run: |
          python - << 'PY'
          import json, re, datetime, pathlib, unicodedata

          NOW = datetime.datetime.utcnow()
          out = []
          def say(s=""): out.append(s)
          def finish(code=0):
              pathlib.Path("reports").mkdir(exist_ok=True)
              pathlib.Path("reports/merge_run.md").write_text("\n".join(out), encoding="utf-8")
              print("\n".join(out)); raise SystemExit(code)

          def load(path):
              f = pathlib.Path(path)
              if not f.exists(): return None
              try: return json.loads(f.read_text(encoding="utf-8"))
              except Exception: return None

          bm = load("prices.json")      # bet-mate: Betfair with volume
          bt = load("btf_odds.json")    # btfodds: Pinnacle, bet365, betfair, average, best

          say("# Merge odds")
          say("Run %s UTC" % NOW.strftime("%Y-%m-%d %H:%M"))
          say("")
          if not bm or not bt:
              say("**Missing a feed** — bet-mate: %s, btfodds: %s" % (bool(bm), bool(bt)))
              finish(1)
          say("bet-mate generated %s, btfodds generated %s" % (bm.get("generatedAt"), bt.get("generatedAt")))
          say("")

          STRIP = re.compile(r"\b(fc|cf|sc|ac|afc|sv|bk|if|ff|cd|ud|us|sk|nk|ks|club|calcio|"
                             r"city|town|united|utd|de|do|da|el|la|le|the)\b")
          def norm(n):
              n = unicodedata.normalize("NFKD", (n or "").lower())
              n = "".join(c for c in n if not unicodedata.combining(c))
              n = n.replace("&", "and").replace("-", " ").replace(".", " ")
              n = STRIP.sub(" ", n)
              return re.sub(r"[^a-z0-9]", "", n)

          def shorten(n, k=9):
              n = norm(n)
              return n[:k] if len(n) > k else n

          # index the btfodds side on both full and shortened names
          idx = {}
          for m in bt["matches"]:
              for key in (norm(m["home"]) + "|" + norm(m["away"]),
                          shorten(m["home"]) + "|" + shorten(m["away"])):
                  idx.setdefault(key, m)

          merged, unmatched = [], []
          for m in bm["matches"]:
              hit = idx.get(norm(m["home"]) + "|" + norm(m["away"])) \
                 or idx.get(shorten(m["home"]) + "|" + shorten(m["away"]))
              rec = dict(home=m["home"], away=m["away"], league=m["league"],
                         kickoff=m.get("kickoff"), betfairMarket=m.get("betfairMarket"),
                         betfair=dict(odds=m["odds"], goals=m["goals"],
                                      volume1x2=m.get("volume1x2"), volumeGoals=m.get("volumeGoals")),
                         move=m.get("move"))
              if hit:
                  rec["btfName"] = hit["home"] + " v " + hit["away"]
                  rec["books"] = hit["books"]
                  rec["bestAvailable"] = hit.get("bestAvailable")
                  merged.append(rec)
              else:
                  unmatched.append(rec)

          payload = dict(generatedAt=NOW.isoformat()+"Z",
                         sources={"betfair":"bet-mate.co","books":"btfodds.com"},
                         matched=len(merged), unmatched=len(unmatched),
                         matches=merged + unmatched)
          pathlib.Path("merged_odds.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=1), encoding="utf-8")

          total = len(bm["matches"])
          say("bet-mate carried **%d** matches. Paired with btfodds: **%d** (%.0f%%). Unpaired: **%d**."
              % (total, len(merged), 100.0*len(merged)/max(1,total), len(unmatched)))
          say("")

          # do the two Betfair sources agree? a direct check on the same market
          diffs = []
          for r in merged:
              b1 = r["betfair"]["odds"].get("1")
              b2 = (r.get("books") or {}).get("betfair", {}).get("1")
              if b1 and b2:
                  diffs.append((abs(b2/b1 - 1), r, b1, b2))
          if diffs:
              diffs.sort(key=lambda x: -x[0])
              close = sum(1 for d,_,_,_ in diffs if d <= 0.02)
              say("Both feeds carry a Betfair price on **%d** matches. **%d** of them agree within 2%%."
                  % (len(diffs), close))
              say("")
              say("| Match | bet-mate | btfodds | Difference |")
              say("| --- | --- | --- | --- |")
              for d, r, b1, b2 in diffs[:10]:
                  say("| %s v %s | %s | %s | %.1f%% |" % (r["home"], r["away"], b1, b2, d*100))
              say("")

          say("## Pinnacle beside Betfair")
          say("")
          say("| Kick-off | Match | BF 1 | PIN 1 | BF O2.5 | PIN O2.5 | Matched |")
          say("| --- | --- | --- | --- | --- | --- | --- |")
          shown = 0
          for r in merged:
              pin = (r.get("books") or {}).get("pinnacle")
              if not pin: continue
              say("| %s | %s v %s | %s | %s | %s | %s | %s |" % (
                  r["kickoff"] or "—", r["home"], r["away"],
                  r["betfair"]["odds"].get("1","—"), pin.get("1","—"),
                  r["betfair"]["goals"].get("over2_5","—"), pin.get("over2_5","—"),
                  r["betfair"].get("volume1x2","—")))
              shown += 1
              if shown >= 20: break
          if not shown: say("| — | no match carries both | | | | | |")

          if unmatched:
              say("")
              say("## Not paired — names to look at")
              say("")
              for r in unmatched[:25]:
                  say("- %s v %s _(%s)_" % (r["home"], r["away"], r["league"]))

          finish(0)
          PY

      - name: Save
        run: |
          git config user.name  "pattern90-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add -A
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "merged odds $(date -u +%H:%M)"
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          exit 1
