# Pattern90 — how dense is the TotalCorner odds history?
# Takes a handful of matches and reports how many price points each one has,
# how far apart they are, and how much of it lands near kick-off.
name: TotalCorner history check

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "league ids, comma separated"
        required: false
        default: "1427,1431,1432"
      sample:
        description: "how many matches to inspect"
        required: false
        default: "5"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect odds history
        env:
          TC_TOKEN: ${{ secrets.TC_TOKEN }}
          LEAGUES:  ${{ inputs.leagues }}
          SAMPLE:   ${{ inputs.sample }}
        run: |
          python - << 'PY'
          import os, json, time, urllib.request, urllib.parse, datetime, statistics, pathlib

          TOKEN=os.environ.get("TC_TOKEN","").strip()
          IDS=[x.strip() for x in (os.environ.get("LEAGUES") or "").split(",") if x.strip()]
          N=max(1,min(12,int(os.environ.get("SAMPLE") or 5)))
          BASE="https://api.totalcorner.com/v1"; GAP=13
          calls=0; out=[]
          def say(s=""): out.append(s)

          def get(path, params):
              global calls
              if calls: time.sleep(GAP)
              p=dict(params); p["token"]=TOKEN
              try:
                  with urllib.request.urlopen(f"{BASE}{path}?"+urllib.parse.urlencode(p), timeout=45) as r:
                      calls+=1; return json.loads(r.read().decode("utf-8")), None
              except Exception as e:
                  return None, f"connection failed: {e}"
          def err(b):
              if not b: return None
              if not b.get("success"):
                  e=b.get("error",{}); return f'{e.get("code","?")} — {e.get("message","")}'
              return None

          if not TOKEN: print("TC_TOKEN is empty"); raise SystemExit(1)
          say("# TotalCorner odds history — how dense is it?")
          say(f"Checked {datetime.datetime.utcnow():%Y-%m-%d %H:%M} UTC"); say()

          # ---- pick some upcoming matches ----
          picks=[]
          for lid in IDS:
              if len(picks)>=N: break
              b,e=get(f"/league/schedule/{lid}", {"page":1,"columns":"odds"})
              e=e or err(b)
              if e: say(f"- league {lid}: **{e}**"); continue
              d=b.get("data",{}); lname=(d.get("league") or {}).get("name",f"League {lid}")
              for m in d.get("matches",[]):
                  if m.get("status"): continue
                  if len(picks)>=N: break
                  picks.append((m.get("id"), lname, m.get("h"), m.get("a"), m.get("start")))
          if not picks:
              say("No upcoming match found in those leagues.")
              pathlib.Path("reports").mkdir(exist_ok=True)
              pathlib.Path("reports/history_check.md").write_text("\n".join(out),encoding="utf-8")
              print("\n".join(out)); raise SystemExit(0)

          say(f"Inspecting **{len(picks)}** matches."); say()
          rows=[]
          for mid,lname,hh,aa,start in picks:
              b,e=get(f"/match/odds/{mid}", {"columns":"oddsList,goalList,cornerList,asianList"})
              e=e or err(b)
              if e:
                  say(f"## {hh} v {aa}"); say(f"**FAILED** — {e}"); say(); continue
              d=b.get("data",[])
              d=d[0] if isinstance(d,list) and d else (d if isinstance(d,dict) else {})
              say(f"## {hh} v {aa}")
              say(f"{lname} · kick-off {start}"); say()
              say("| list | points | first stamp | last stamp | median gap | points in last 6h |")
              say("| --- | --- | --- | --- | --- | --- |")
              for key,label in [("odds_list","1X2"),("goal_list","goal line"),
                                ("corner_list","corner line"),("asian_list","asian")]:
                  L=d.get(key) or []
                  if not L:
                      say(f"| {label} | 0 | — | — | — | — |"); continue
                  # each entry: status, line/handicap, home, away, time, hg, ag  (field order can vary)
                  stamps=[]
                  for row in L:
                      t=None
                      for v in (row if isinstance(row,list) else list(row.values())):
                          sv=str(v)
                          if len(sv)>=16 and sv[4] in "-/" and ":" in sv:
                              t=sv; break
                      if t: stamps.append(t)
                  def parse(x):
                      for f in ("%Y-%m-%d %H:%M:%S","%Y-%m-%d %H:%M","%Y/%m/%d %H:%M:%S"):
                          try: return datetime.datetime.strptime(x,f)
                          except: pass
                      return None
                  ts=sorted([p for p in map(parse,stamps) if p])
                  if len(ts)<2:
                      say(f"| {label} | {len(L)} | {stamps[0] if stamps else '—'} | — | — | — |"); continue
                  gaps=[(ts[i+1]-ts[i]).total_seconds()/60 for i in range(len(ts)-1)]
                  ko=parse(start) or ts[-1]
                  near=sum(1 for t in ts if 0 <= (ko-t).total_seconds()/3600 <= 6)
                  say(f"| {label} | {len(L)} | {ts[0]:%d %b %H:%M} | {ts[-1]:%d %b %H:%M} | "
                      f"{statistics.median(gaps):.0f} min | {near} |")
                  rows.append((label,len(L),statistics.median(gaps),near))
              say()
              # one raw entry so we can see the exact field order
              first=(d.get("odds_list") or [None])[0]
              if first is not None:
                  say("One raw 1X2 entry, so the field order is visible:")
                  say("```json"); say(json.dumps(first,ensure_ascii=False)); say("```"); say()

          if rows:
              say("## Verdict")
              o=[r for r in rows if r[0]=="1X2"]
              if o:
                  pts=statistics.median([r[1] for r in o]); gap=statistics.median([r[2] for r in o])
                  near=statistics.median([r[3] for r in o])
                  say(f"A typical match carries **{pts:.0f}** 1X2 price points, about **{gap:.0f} minutes** apart, "
                      f"with **{near:.0f}** of them inside the last six hours before kick-off.")
                  say()
                  if pts>=20 and gap<=90:
                      say("**Dense enough.** A price path can be drawn straight from this, with no new logging.")
                  elif pts>=8:
                      say("**Thin but usable.** Good enough for a rough shape; the last hours would still need our own capture.")
                  else:
                      say("**Too thin.** Only our own repeated capture will produce a usable price path.")
          say(); say(f"API calls used: {calls}")
          pathlib.Path("reports").mkdir(exist_ok=True)
          pathlib.Path("reports/history_check.md").write_text("\n".join(out),encoding="utf-8")
          print("\n".join(out))
          PY
      - name: Commit
        run: |
          git config user.name  "pattern90-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "TotalCorner history check" || echo "nothing to commit"
          git push

