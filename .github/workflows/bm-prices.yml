# Pattern90 — what does btfodds actually return?
# Tries a few bookmaker names and market types, reports what comes back.
# Read the report, then we know exactly what to ask for.
name: btfodds probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe
        run: |
          python - << 'PY'
          import json, re, html, time, datetime, pathlib, urllib.request, urllib.parse

          BASE="https://www.btfodds.com/classes/soccer/football-odds/"
          log=[]
          def say(s=""): log.append(s)

          def call(page, bookie, typ):
              params={"id":"1","sport":"soccer","pg":"soccer/football-odds/display-odds",
                      "date":"today","country":"all","bookie":bookie,"type":typ,
                      "sort":"league","oddType":"eu","tz":"Europe/Bucharest","upd":3}
              url=BASE+page+"?alldata="+urllib.parse.quote(json.dumps(params,separators=(",",":")))
              url+=f"&_={int(time.time()*1000)}"
              req=urllib.request.Request(url, headers={
                  "User-Agent":"Mozilla/5.0 (compatible; Pattern90/1.0)",
                  "Referer":"https://www.btfodds.com/soccer/football-odds/display-odds,all,today,average,UO,league",
                  "X-Requested-With":"XMLHttpRequest",
                  "Accept":"*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.read().decode("utf-8","replace"), None
              except Exception as e:
                  return None, str(e)

          say("# btfodds probe")
          say(f"Run {datetime.datetime.utcnow():%Y-%m-%d %H:%M} UTC"); say()

          BOOKIES=["average","pinnacle","pinnaclesports","Pinnacle","pin","bet365","betfair"]
          TYPES=["UO","1X2","HA"]
          PAGES=["display-odds.php","display-odds-ajax.php"]

          say("| page | bookie | type | bytes | rows | first team seen |")
          say("| --- | --- | --- | --- | --- | --- |")
          keep={}
          for page in PAGES:
              for bookie in BOOKIES:
                  body,err=call(page,bookie,"UO")
                  if err:
                      say(f"| {page} | {bookie} | UO | — | — | {err[:40]} |"); continue
                  rows=len(re.findall(r'data-sort0=', body)) or len(re.findall(r'<tr', body))
                  team=re.search(r'>([A-Z][A-Za-z\. ]{3,25}) - ([A-Z][A-Za-z\. ]{3,25})<', body)
                  say(f"| {page} | {bookie} | UO | {len(body):,} | {rows} | {team.group(0)[1:40] if team else '—'} |")
                  if rows: keep[(page,bookie,"UO")]=body
                  time.sleep(1)

          say()
          say("| page | bookie | type | bytes | rows |")
          say("| --- | --- | --- | --- | --- |")
          for typ in TYPES:
              body,err=call("display-odds.php","average",typ)
              if err: say(f"| display-odds.php | average | {typ} | — | {err[:40]} |"); continue
              rows=len(re.findall(r'data-sort0=', body)) or len(re.findall(r'<tr', body))
              say(f"| display-odds.php | average | {typ} | {len(body):,} | {rows} |")
              if rows: keep[("display-odds.php","average",typ)]=body
              time.sleep(1)

          # keep one sample so we can see the shape of a row
          if keep:
              k=sorted(keep, key=lambda x:-len(keep[x]))[0]
              sample=keep[k]
              pathlib.Path("reports").mkdir(exist_ok=True)
              pathlib.Path("reports/btf_sample.html").write_text(sample[:40000],encoding="utf-8")
              say(); say(f"Saved a sample from **{k[0]} · {k[1]} · {k[2]}** to `reports/btf_sample.html`.")
              say()
              say("First 1,500 characters:"); say("```html")
              say(sample[:1500]); say("```")
          else:
              say(); say("**Nothing came back with rows** — the request may need a cookie or a different name.")

          pathlib.Path("reports").mkdir(exist_ok=True)
          pathlib.Path("reports/btf_probe.md").write_text("\n".join(log),encoding="utf-8")
          print("\n".join(log))
          PY
      - name: Commit
        run: |
          git config user.name  "pattern90-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add -A
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "btfodds probe"
          git push origin "HEAD:${GITHUB_REF_NAME}"
