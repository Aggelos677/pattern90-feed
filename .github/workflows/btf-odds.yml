name: BTF odds

on:
  workflow_dispatch:
    inputs:
      bookies:
        description: "which books, comma separated"
        required: false
        default: "pinnacle,bet365,average,best"
      date:
        description: "today, tomorrow, next-7days"
        required: false
        default: "today"
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: btf-odds
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull the odds
        env:
          BOOKIES: ${{ inputs.bookies || 'pinnacle,bet365,average,best' }}
          DATE:    ${{ inputs.date    || 'today' }}
        run: |
          python - << 'PY'
          import os, re, json, html, time, datetime, pathlib, urllib.request, urllib.parse

          BASE = "https://www.btfodds.com/classes/soccer/football-odds/display-odds.php"
          BOOKS = [b.strip() for b in (os.environ.get("BOOKIES") or "pinnacle").split(",") if b.strip()]
          DATE  = (os.environ.get("DATE") or "today").strip()
          NOW   = datetime.datetime.utcnow()
          out = []
          def say(s=""): out.append(s)

          def fetch(bookie):
              p = {"id":"1","sport":"soccer","pg":"soccer/football-odds/display-odds",
                   "date":DATE,"country":"all","bookie":bookie,"type":"UO",
                   "sort":"league","oddType":"eu","tz":"Europe/Bucharest","upd":3}
              u = BASE + "?alldata=" + urllib.parse.quote(json.dumps(p, separators=(",",":")))
              u += "&_=%d" % int(time.time()*1000)
              r = urllib.request.Request(u, headers={
                  "User-Agent":"Mozilla/5.0 (compatible; Pattern90/1.0)",
                  "Referer":"https://www.btfodds.com/soccer/football-odds/display-odds,all,today,average,UO,league",
                  "X-Requested-With":"XMLHttpRequest", "Accept":"*/*"})
              with urllib.request.urlopen(r, timeout=60) as resp:
                  return resp.read().decode("utf-8","replace")

          def clean(t):
              return html.unescape(re.sub(r"<[^>]+>", " ", t)).strip()

          def parse(body):
              rows = {}
              league = None
              for chunk in re.split(r"<tr", body):
                  if 'class="league"' in chunk:
                      m = re.search(r"<span>([^<]+)</span>", chunk)
                      if m: league = html.unescape(m.group(1)).strip()
                      continue
                  mid = re.search(r'id="m(\d+)"', chunk)
                  if not mid: continue
                  ko = re.search(r'class="date[^"]*">([^<]+)</td>', chunk)
                  ev = re.search(r'/search/[^"]*">([^<]+)</a>', chunk)
                  if not ev: continue
                  teams = html.unescape(ev.group(1)).strip()
                  home, away = (teams.split(" - ", 1) + [""])[:2]
                  odds, best = {}, {}
                  for cell in re.findall(r'<td[^>]*id="m_\d+_(1x2_\d|250_\d)"[^>]*>.*?</td>', chunk, re.S):
                      pass
                  for m in re.finditer(
                      r'<td[^>]*?title="([^"]*)"[^>]*?id="m_\d+_(1x2_\d|250_\d)"[^>]*?data-odd="([\d.]+)"', chunk):
                      title, slot, odd = m.group(1), m.group(2), float(m.group(3))
                      key = {"1x2_1":"1","1x2_2":"X","1x2_3":"2",
                             "250_1":"under2_5","250_2":"over2_5"}.get(slot)
                      if not key: continue
                      odds[key] = odd
                      parts = clean(title).split()
                      if len(parts) >= 2:
                          try: best[key] = {"odd": float(parts[0]), "book": " ".join(parts[1:])}
                          except ValueError: pass
                  if not odds: continue
                  rows[mid.group(1)] = dict(id=mid.group(1), league=league,
                      kickoff=ko.group(1).strip() if ko else None,
                      home=home.strip(), away=away.strip(), odds=odds, best=best)
              return rows

          say("# BTF odds")
          say("Run %s UTC · date = %s" % (NOW.strftime("%Y-%m-%d %H:%M"), DATE))
          say("")

          byBook = {}
          for b in BOOKS:
              try:
                  body = fetch(b)
              except Exception as e:
                  say("- %s: **failed** — %s" % (b, str(e)[:70])); continue
              r = parse(body)
              byBook[b] = r
              full = sum(1 for x in r.values() if len(x["odds"]) >= 5)
              say("- **%s**: %d matches, %d of them with 1X2 and Over/Under" % (b, len(r), full))
              time.sleep(2)

          if not byBook:
              pathlib.Path("reports").mkdir(exist_ok=True)
              pathlib.Path("reports/btf_odds_run.md").write_text("\n".join(out), encoding="utf-8")
              print("\n".join(out)); raise SystemExit(1)

          # one record per match, every book beside it
          ids = set()
          for r in byBook.values(): ids |= set(r.keys())
          matches = []
          for i in sorted(ids):
              base = None
              books = {}
              for b, r in byBook.items():
                  if i in r:
                      base = base or r[i]
                      books[b] = r[i]["odds"]
              rec = dict(id=i, league=base["league"], kickoff=base["kickoff"],
                         home=base["home"], away=base["away"], books=books)
              if "average" in byBook and i in byBook["average"]:
                  rec["bestAvailable"] = byBook["average"][i]["best"]
              matches.append(rec)

          payload = dict(generatedAt=NOW.isoformat()+"Z", source="btfodds.com",
                         date=DATE, books=BOOKS, matches=matches)
          pathlib.Path("btf_odds.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=1), encoding="utf-8")

          # keep every snapshot so movement can be measured later
          hdir = pathlib.Path("history_btf"); hdir.mkdir(exist_ok=True)
          hf = hdir / (NOW.strftime("%Y-%m-%d") + ".json")
          hist = json.loads(hf.read_text(encoding="utf-8")) if hf.exists() else {"points": []}
          hist["points"].append({"t": NOW.isoformat()+"Z",
              "m": {m["id"]: m["books"].get("pinnacle") or next(iter(m["books"].values()), None)
                    for m in matches}})
          hist["points"] = hist["points"][-200:]
          hf.write_text(json.dumps(hist, ensure_ascii=False), encoding="utf-8")

          pin = [m for m in matches if "pinnacle" in m["books"]]
          say("")
          say("Written **%d** matches to `btf_odds.json`. Pinnacle covers **%d** of them." % (len(matches), len(pin)))
          say("History now holds **%d** snapshots for today." % len(hist["points"]))
          say("")
          say("| Kick-off | Match | PIN 1 | X | 2 | B365 1 | X | 2 | PIN O2.5 | B365 O2.5 |")
          say("| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |")
          for m in pin[:22]:
              o = m["books"]["pinnacle"]
              b = m["books"].get("bet365", {})
              say("| %s | %s v %s | %s | %s | %s | %s | %s | %s | %s | %s |" % (
                  m["kickoff"] or "—", m["home"], m["away"],
                  o.get("1","—"), o.get("X","—"), o.get("2","—"),
                  b.get("1","—"), b.get("X","—"), b.get("2","—"),
                  o.get("over2_5","—"), b.get("over2_5","—")))

          # where a soft book is longer than Pinnacle, that is worth seeing
          gaps = []
          for m in matches:
              o = m["books"].get("pinnacle"); b = m["books"].get("bet365")
              if not o or not b: continue
              for k in ("1","X","2","over2_5","under2_5"):
                  if o.get(k) and b.get(k) and b[k] > o[k]:
                      gaps.append((b[k]/o[k]-1, m, k, o[k], b[k]))
          gaps.sort(key=lambda x: -x[0])
          if gaps:
              say("")
              say("## Where bet365 pays more than Pinnacle")
              say("")
              say("| Match | Selection | Pinnacle | bet365 | Difference |")
              say("| --- | --- | --- | --- | --- |")
              for d, m, k, po, bo in gaps[:15]:
                  say("| %s v %s | %s | %s | %s | +%.1f%% |" % (m["home"], m["away"], k, po, bo, d*100))

          pathlib.Path("reports").mkdir(exist_ok=True)
          pathlib.Path("reports/btf_odds_run.md").write_text("\n".join(out), encoding="utf-8")
          print("\n".join(out))
          PY

      - name: Save
        run: |
          git config user.name  "pattern90-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add -A
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "btf odds $(date -u +%H:%M)"
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          exit 1
