name: BTF check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ask btfodds what it has
        run: |
          python - << 'PY'
          import json, re, time, datetime, pathlib, urllib.request, urllib.parse

          BASE = "https://www.btfodds.com/classes/soccer/football-odds/"
          out = []
          def say(s=""): out.append(s)

          def call(page, bookie, typ):
              p = {"id":"1","sport":"soccer","pg":"soccer/football-odds/display-odds",
                   "date":"today","country":"all","bookie":bookie,"type":typ,
                   "sort":"league","oddType":"eu","tz":"Europe/Bucharest","upd":3}
              u = BASE + page + "?alldata=" + urllib.parse.quote(json.dumps(p, separators=(",",":")))
              u += "&_=%d" % int(time.time()*1000)
              r = urllib.request.Request(u, headers={
                  "User-Agent":"Mozilla/5.0 (compatible; Pattern90/1.0)",
                  "Referer":"https://www.btfodds.com/soccer/football-odds/display-odds,all,today,average,UO,league",
                  "X-Requested-With":"XMLHttpRequest",
                  "Accept":"*/*"})
              try:
                  with urllib.request.urlopen(r, timeout=45) as resp:
                      return resp.read().decode("utf-8","replace"), None
              except Exception as e:
                  return None, str(e)[:60]

          say("# BTF check")
          say("Run %s UTC" % datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M"))
          say("")
          say("| page | bookie | market | bytes | rows | note |")
          say("| --- | --- | --- | --- | --- | --- |")

          best = None
          for page in ["display-odds.php", "display-odds-ajax.php"]:
              for bookie in ["average", "pinnacle", "pinnaclesports", "Pinnacle", "bet365", "betfair"]:
                  for typ in ["UO", "1X2"]:
                      body, err = call(page, bookie, typ)
                      if err:
                          say("| %s | %s | %s | — | — | %s |" % (page, bookie, typ, err))
                          continue
                      rows = len(re.findall(r"data-sort0=", body))
                      if rows == 0:
                          rows = len(re.findall(r"<tr", body))
                      note = "ok" if rows else "no rows"
                      say("| %s | %s | %s | %s | %d | %s |" % (page, bookie, typ, format(len(body), ","), rows, note))
                      if rows and (best is None or len(body) > len(best[1])):
                          best = ((page, bookie, typ), body)
                      time.sleep(1)

          pathlib.Path("reports").mkdir(exist_ok=True)
          if best:
              key, body = best
              pathlib.Path("reports/btf_sample.html").write_text(body[:40000], encoding="utf-8")
              say("")
              say("Best response came from **%s · %s · %s**." % key)
              say("")
              say("```html")
              say(body[:1200])
              say("```")
          else:
              say("")
              say("**No rows came back from any combination.**")

          pathlib.Path("reports/btf_check.md").write_text("\n".join(out), encoding="utf-8")
          print("\n".join(out))
          PY

      - name: Save the result
        run: |
          git config user.name  "pattern90-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add -A
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "btf check"
          git push origin "HEAD:${GITHUB_REF_NAME}"


