name: Pull all odds

on:
  workflow_dispatch:
    inputs:
      bookies:
        description: "which books from btfodds"
        required: false
        default: "pinnacle,bet365,betfair,average,best"
      days:
        description: "bet-mate days: today, tomorrow, all"
        required: false
        default: "today,tomorrow,all"
      btfdays:
        description: "btfodds days: today, tomorrow, next-7days"
        required: false
        default: "today,next-7days"
  schedule:
    - cron: "10 * * * *"

permissions:
  contents: write

concurrency:
  group: pull-all
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull both feeds and marry them
        env:
          BOOKIES: ${{ inputs.bookies || 'pinnacle,bet365,betfair,average,best' }}
          DAYS:    ${{ inputs.days    || 'today,tomorrow,all' }}
          BTFDAYS: ${{ inputs.btfdays || 'today,next-7days' }}
        run: |
          python - << 'PY'
          import os, re, json, html, time, datetime, pathlib, unicodedata, urllib.request, urllib.parse

          NOW = datetime.datetime.utcnow()
          out = []
          def say(s=""): out.append(s)
          def finish(code=0):
              pathlib.Path("reports").mkdir(exist_ok=True)
              pathlib.Path("reports/pull_all.md").write_text("\n".join(out), encoding="utf-8")
              print("\n".join(out)); raise SystemExit(code)

          say("# Pull all odds")
          say("Run %s UTC — both feeds read inside the same minute, so they can be compared."
              % NOW.strftime("%Y-%m-%d %H:%M"))
          say("")

          # ---------------- bet-mate: Betfair with volume ----------------
          def betmate(day="today"):
              url = ("https://www.bet-mate.co/classes/home-ajax.php?date=%s&_=%d"
                     % (day, int(time.time()*1000)))
              req = urllib.request.Request(url, headers={
                  "User-Agent":"Mozilla/5.0 (compatible; Pattern90/1.0)",
                  "Referer":"https://www.bet-mate.co/",
                  "X-Requested-With":"XMLHttpRequest",
                  "Accept":"text/html, */*; q=0.01"})
              with urllib.request.urlopen(req, timeout=45) as r:
                  raw = r.read().decode("utf-8","replace")
              def num(x):
                  try: return float(str(x).replace(",",""))
                  except: return None
              def odd(x):
                  v = num(x)
                  return v if (v is not None and 1.01 <= v <= 1000) else None
              rows = []
              for b in re.split(r'<div class="body (?:even|odd)"', raw)[1:]:
                  a = dict(re.findall(r'data-sort(\d+)="([^"]*)"', b))
                  o1, ox, o2 = odd(a.get("3")), odd(a.get("4")), odd(a.get("5"))
                  ko = re.search(r'>([A-Z][a-z]{2} \d{2}:\d{2})', b)
                  teams = re.search(r'</span>\s*([^<>]+?)\s*</div>', b)
                  mid = re.search(r'market\?id=([\d.]+)', b)
                  cells = [num(x) for x in re.findall(
                      r'<div class="col-md-\d[^"]*"[^>]*>(?:&#0128;)?\s*([\d.,]+)\s*</div>', b)]
                  cells = [c for c in cells if c is not None]
                  u = o = vol2 = None
                  if len(cells) >= 7:
                      u, o, vol2 = odd(cells[4]), odd(cells[5]), cells[6]
                  if not (o1 and ox and o2 and teams and mid): continue
                  t = teams.group(1)
                  home, away = [x.strip() for x in t.split(" - ", 1)] if " - " in t else (t, "")
                  rows.append(dict(id=mid.group(1), day=day, league=html.unescape(a.get("1","")).strip(),
                      kickoff=ko.group(1) if ko else None,
                      home=html.unescape(home), away=html.unescape(away),
                      odds={"1":o1,"X":ox,"2":o2}, volume1x2=num(a.get("2")),
                      goals={"under2_5":u,"over2_5":o}, volumeGoals=vol2))
              return rows

          # ---------------- btfodds: several books ----------------
          BTF = "https://www.btfodds.com/classes/soccer/football-odds/display-odds.php"
          def btfodds(bookie, day="today"):
              p = {"id":"1","sport":"soccer","pg":"soccer/football-odds/display-odds",
                   "date":day,"country":"all","bookie":bookie,"type":"UO",
                   "sort":"league","oddType":"eu","tz":"Europe/Bucharest","upd":3}
              u = BTF + "?alldata=" + urllib.parse.quote(json.dumps(p, separators=(",",":")))
              u += "&_=%d" % int(time.time()*1000)
              req = urllib.request.Request(u, headers={
                  "User-Agent":"Mozilla/5.0 (compatible; Pattern90/1.0)",
                  "Referer":"https://www.btfodds.com/soccer/football-odds/display-odds,all,today,average,UO,league",
                  "X-Requested-With":"XMLHttpRequest","Accept":"*/*"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = r.read().decode("utf-8","replace")
              def clean(t): return html.unescape(re.sub(r"<[^>]+>"," ",t)).strip()
              rows, league = {}, None
              for chunk in re.split(r"<tr", body):
                  if 'class="league"' in chunk:
                      m = re.search(r"<span>([^<]+)</span>", chunk)
                      if m: league = html.unescape(m.group(1)).strip()
                      continue
                  mid = re.search(r'id="m(\d+)"', chunk)
                  ev = re.search(r'/search/[^"]*">([^<]+)</a>', chunk)
                  if not (mid and ev): continue
                  ko = re.search(r'class="date[^"]*">([^<]+)</td>', chunk)
                  teams = html.unescape(ev.group(1)).strip()
                  home, away = (teams.split(" - ",1) + [""])[:2]
                  odds, best = {}, {}
                  for m in re.finditer(
                      r'<td[^>]*?title="([^"]*)"[^>]*?id="m_\d+_(1x2_\d|250_\d)"[^>]*?data-odd="([\d.]+)"', chunk):
                      k = {"1x2_1":"1","1x2_2":"X","1x2_3":"2",
                           "250_1":"under2_5","250_2":"over2_5"}[m.group(2)]
                      v = float(m.group(3))
                      if not (1.01 <= v <= 1000): continue
                      odds[k] = v
                      parts = clean(m.group(1)).split()
                      if len(parts) >= 2:
                          try: best[k] = {"odd": float(parts[0]), "book": " ".join(parts[1:])}
                          except ValueError: pass
                  if odds:
                      rows[mid.group(1)] = dict(id=mid.group(1), day=day, league=league,
                          kickoff=ko.group(1).strip() if ko else None,
                          home=home.strip(), away=away.strip(), odds=odds, best=best)
              return rows

          DAYS = [d.strip() for d in os.environ.get("DAYS","today").split(",") if d.strip()]
          bm, seen = [], set()
          for d in DAYS:
              try:
                  part = betmate(d)
              except Exception as e:
                  say("**bet-mate %s failed** — %s" % (d, str(e)[:70])); continue
              fresh = [r for r in part if r["id"] not in seen]
              seen |= {r["id"] for r in fresh}
              bm += fresh
              say("bet-mate %s: **%d** matches" % (d, len(fresh)))
              time.sleep(1)

          BTFDAYS = [d.strip() for d in os.environ.get("BTFDAYS","today").split(",") if d.strip()]
          byBook = {}
          for b in [x.strip() for x in os.environ.get("BOOKIES","pinnacle").split(",") if x.strip()]:
              byBook[b] = {}
              got = []
              for d in BTFDAYS:
                  try:
                      part = btfodds(b, d)
                  except Exception as e:
                      say("btfodds %s %s: **failed** — %s" % (b, d, str(e)[:50])); continue
                  for i, m in part.items(): byBook[b].setdefault(i, m)
                  got.append("%s %d" % (d, len(part)))
                  time.sleep(2)
              say("btfodds %s: **%d** matches (%s)" % (b, len(byBook[b]), ", ".join(got)))
          byBook = {b: r for b, r in byBook.items() if r}
          if not bm or not byBook: finish(1)
          say("")

          # ---------------- match the names ----------------
          STRIP = re.compile(r"\b(fc|cf|sc|ac|afc|sv|bk|if|ff|cd|ud|us|sk|nk|ks|club|calcio|"
                             r"city|town|united|utd|de|do|da|del|la|le|the|kulubu|futbol)\b")
          SWAP = [("oe","o"),("ae","a"),("ue","u"),("aa","a"),("oo","o"),("ss","s"),
                  ("ff","f"),("tt","t"),("ll","l"),("nn","n"),("mm","m"),("rr","r"),("cc","c")]
          def norm(n):
              n = unicodedata.normalize("NFKD", (n or "").lower())
              n = "".join(c for c in n if not unicodedata.combining(c))
              n = n.replace("&"," and ").replace("-"," ").replace(".", " ").replace("'"," ")
              n = STRIP.sub(" ", n)
              n = re.sub(r"[^a-z0-9]", "", n)
              for a, b in SWAP: n = n.replace(a, b)      # Malmoe -> Malmo, Oergryte -> Orgryte
              return n
          def key(h, a, k=7):
              nh, na = norm(h), norm(a)
              return nh[:k] + "|" + na[:k]

          # index every btfodds fixture under several keys
          idx = {}
          allbtf = {}
          for b, rows in byBook.items():
              for i, m in rows.items():
                  allbtf.setdefault(i, m)
          for i, m in allbtf.items():
              for kk in (norm(m["home"]) + "|" + norm(m["away"]), key(m["home"], m["away"]),
                         key(m["home"], m["away"], 5)):
                  idx.setdefault(kk, i)

          merged, unmatched = [], []
          for m in bm:
              hit = (idx.get(norm(m["home"]) + "|" + norm(m["away"]))
                     or idx.get(key(m["home"], m["away"]))
                     or idx.get(key(m["home"], m["away"], 5)))
              rec = dict(home=m["home"], away=m["away"], league=m["league"],
                         day=m.get("day"), kickoff=m["kickoff"],
                         betfairMarket=m["id"],
                         betfair=dict(odds=m["odds"], goals=m["goals"],
                                      volume1x2=m["volume1x2"], volumeGoals=m["volumeGoals"]))
              if hit:
                  rec["btfName"] = allbtf[hit]["home"] + " v " + allbtf[hit]["away"]
                  rec["books"] = {b: byBook[b][hit]["odds"] for b in byBook if hit in byBook[b]}
                  if "average" in byBook and hit in byBook["average"]:
                      rec["bestAvailable"] = byBook["average"][hit]["best"]
                  merged.append(rec)
              else:
                  unmatched.append(rec)

          payload = dict(generatedAt=NOW.isoformat()+"Z",
                         sources={"betfair":"bet-mate.co","books":"btfodds.com"},
                         matched=len(merged), unmatched=len(unmatched),
                         matches=merged + unmatched)
          pathlib.Path("merged_odds.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=1), encoding="utf-8")

          hdir = pathlib.Path("history_all"); hdir.mkdir(exist_ok=True)
          hf = hdir / (NOW.strftime("%Y-%m-%d") + ".json")
          hist = json.loads(hf.read_text(encoding="utf-8")) if hf.exists() else {"points":[]}
          hist["points"].append({"t": NOW.isoformat()+"Z",
              "m": {r["betfairMarket"]: {"bf": r["betfair"]["odds"],
                                         "vol": r["betfair"]["volume1x2"],
                                         "pin": (r.get("books") or {}).get("pinnacle")}
                    for r in merged}})
          hist["points"] = hist["points"][-200:]
          hf.write_text(json.dumps(hist, ensure_ascii=False), encoding="utf-8")

          say("Paired **%d** of %d bet-mate matches (%.0f%%). History holds **%d** snapshots today."
              % (len(merged), len(bm), 100.0*len(merged)/max(1,len(bm)), len(hist["points"])))
          byday = {}
          for r in merged: byday[r.get("day","?")] = byday.get(r.get("day","?"),0)+1
          say("Paired by day: " + ", ".join("**%s** %d" % (k,v) for k,v in sorted(byday.items())))
          say("")

          # both feeds carry Betfair — now read at the same moment, so they should agree
          diffs = []
          for r in merged:
              b1 = r["betfair"]["odds"].get("1")
              b2 = (r.get("books") or {}).get("betfair", {}).get("1")
              if b1 and b2: diffs.append((abs(b2/b1-1), r, b1, b2))
          if diffs:
              diffs.sort(key=lambda x: -x[0])
              close = sum(1 for d,_,_,_ in diffs if d <= 0.02)
              say("The two Betfair readings agree within 2%% on **%d of %d** matches." % (close, len(diffs)))
              if diffs[0][0] > 0.02:
                  say("")
                  say("| Match | bet-mate | btfodds | Difference |")
                  say("| --- | --- | --- | --- |")
                  for d, r, b1, b2 in diffs[:8]:
                      say("| %s v %s | %s | %s | %.1f%% |" % (r["home"], r["away"], b1, b2, d*100))
              say("")

          say("## Pinnacle beside Betfair")
          say("")
          say("| Day | Kick-off | Match | BF 1 | PIN 1 | BF O2.5 | PIN O2.5 | Matched |")
          say("| --- | --- | --- | --- | --- | --- | --- | --- |")
          n = 0
          for r in merged:
              pin = (r.get("books") or {}).get("pinnacle")
              if not pin: continue
              say("| %s | %s | %s v %s | %s | %s | %s | %s | %s |" % (
                  r.get("day","—"), r["kickoff"] or "—", r["home"], r["away"],
                  r["betfair"]["odds"].get("1","—"), pin.get("1","—"),
                  r["betfair"]["goals"].get("over2_5","—"), pin.get("over2_5","—"),
                  r["betfair"].get("volume1x2","—")))
              n += 1
              if n >= 20: break

          if unmatched:
              say("")
              say("## Still unpaired")
              say("")
              for r in unmatched[:20]:
                  say("- %s v %s _(%s)_" % (r["home"], r["away"], r["league"]))
          finish(0)
          PY

      - name: Save
        run: |
          git config user.name  "pattern90-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add -A
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "all odds $(date -u +%H:%M)"
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          exit 1
